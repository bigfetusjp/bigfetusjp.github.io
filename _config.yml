# Site settings
title: ビッグフィータス
url: https://bigfetus.co.jp
baseurl: ""
google_analytics: G-5P4R8GG6VK

# Company information
company:
  name_ja: ビッグフィータス合同会社
  name_en: Big Fetus LLC
  established: 2025-03-14
  ceo_en: Jonathan Allen

# SEO
description_ja: >-
  ビッグフィータス合同会社は、大阪に拠点を置くB2B輸出会社です。日本の漫画家のオリジナル作品を印刷し、アメリカやヨーロッパで販売しています。
description_en: >-
  Big Fetus LLC is a business-to-business export company based in Osaka, Japan.
  We print Japanese manga artists’ original artwork to distribute in the U.S. and Europe.

# Polyglot i18n settings
languages: ["ja", "en"]
default_lang: "ja"
exclude_from_localization: ["assets", "CNAME", "robots.txt", "sitemap.xml"]
parallel_localization: true

# Build settings
plugins:
  - jekyll-polyglot
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
